apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: host-app1
  name: host-app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host-app1
  strategy: {}
  template:
    metadata:
      labels:
        app: host-app1
    spec:
      containers:
      - image: nginx:1.25
        name: nginx
        ports:
        - containerPort: 80
        resources: {}
status: {}
