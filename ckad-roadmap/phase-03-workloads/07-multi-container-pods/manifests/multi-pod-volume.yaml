apiVersion: v1
kind: Pod
metadata:
  name: multi-pod-volume
spec:
  volumes:
  - name: shared-data
    emptyDir: {}
  containers:
  - command:
    - sh
    - -c
    - while true; do date >> /data/output.txt; sleep 5; done
    image: busybox:1.36
    name: writer
    volumeMounts:
    - name: shared-data
      mountPath: /data  
  - command:
    - sh
    - -c
    - touch /data/output.txt; tail -f /data/output.txt;
    image: busybox:1.36
    name: reader
    volumeMounts:
    - name: shared-data
      mountPath: /data
