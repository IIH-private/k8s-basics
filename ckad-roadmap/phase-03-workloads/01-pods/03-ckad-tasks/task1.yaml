apiVersion: v1
kind: Pod
metadata:
  name: web-app
spec:
  containers:
  - image: nginx
    name: nginx
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10    
    env:
    - name: APP_ENV
      value: production    
  resources:
    requests: 
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi    
