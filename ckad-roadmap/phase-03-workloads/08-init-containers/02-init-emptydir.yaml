apiVersion: v1
kind: Pod
metadata:
  name: init-emptydir
spec:
  volumes:
    - name: shared-data
      emptyDir: {}
  initContainers:      
  - image: busybox:1.36
    name: create-html
    command:
      - sh
      - -c
      - |
        echo "<h1>Hello from Init Container<h1>" > /work/index.html  
    volumeMounts:
      - name: shared-data
        mountPath: /work  
  containers:
  - image: nginx:latest
    name: nginx
    volumeMounts:
      - name: shared-data
        mountPath: /usr/share/nginx/html  
