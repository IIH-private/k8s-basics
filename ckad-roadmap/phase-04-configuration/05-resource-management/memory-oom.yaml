apiVersion: v1
kind: Pod
metadata:
  name: memory-oom
spec:
  containers:
    - name: memory-oom
      image: python:3.12-alpine
      command:
        - python
        - -c
        - |
          import time
          print("Container started")
          time.sleep(5)
          print("Allocating memory")
          x = bytearray(100 * 1024 * 1024)
          time.sleep(3600)
      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi"
