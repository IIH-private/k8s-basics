apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: resource-web
  name: resource-web-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resource-web
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: resource-web
    spec:
      containers:
      - image: nginx:1.29
        name: nginx
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"    
status: {}
