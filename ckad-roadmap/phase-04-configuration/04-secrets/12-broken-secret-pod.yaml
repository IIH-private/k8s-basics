apiVersion: v1
kind: Pod
metadata:
  name: broken-secret-app
spec:
  containers:
    - name: app
      image: alpine
      command:
        - sh
        - -c
        - |
          echo "Application started"
          echo "User=$DATABASE_USER"
          echo "Password=$DATABASE_PASSWORD"
          echo "Config files:"
          ls -l /etc/database
          sleep 3600

      env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: production-db
              key: DB_USER

        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: production-db
              key: DB_PASSWORD

      volumeMounts:
        - name: database-config
          mountPath: /etc/database
          readOnly: true

  volumes:
    - name: database-config
      secret:
        secretName: production-db
        optional: true  
        items:
          - key: DB_HOST
            path: host
          - key: DB_PORT
            path: port
