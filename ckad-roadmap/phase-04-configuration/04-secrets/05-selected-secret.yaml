apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: selected-secret
  name: selected-secret
spec:
  volumes:
  - name: secret-volume
    secret:
     secretName: database-env-secret
     items:
       - key: DB_USER
         path: username
       - key: DB_PASSWORD
         path: password    
  containers:
  - command:
    - sleep
    - "3600"
    image: alpine
    name: selected-secret
    volumeMounts:
      - name: secret-volume
        mountPath: /etc/database
        readOnly: true  
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
