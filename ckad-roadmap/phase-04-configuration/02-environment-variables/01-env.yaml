apiVersion: v1
kind: Pod
metadata:
  labels:
    app: env-demo
    owener: ingvar
  name: env-demo
spec:
  containers:
  - command:
    - sh
    - -c
    - env && sleep 3600
    env:
    - name: APP_COLOR
      value: blue
    - name: APP_VERSION
      value: "1.0"
    - name: COMPANY
      value: CKAD-lab
    image: busybox:1.36
    name: busybox
