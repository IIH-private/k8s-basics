apiVersion: v1
kind: Pod
metadata:
  name: company-pod
spec:
  containers:
  - command:
    - sh
    - -c
    - |  
      echo "Company: $COMPANY"; 
      echo "Application: $APP_NAME"; 
      echo "Version: $APP_VERSION";
      echo "Log Level: $LOG_LEVEL"; 
      sleep 3600 
    env:
    - name: COMPANY
      value: OpenAI
    - name: APP_NAME
      value: Inventory
    - name: APP_VERSION
      value: "2.5"
    - name: LOG_LEVEL
      value: info
    image: busybox:1.36
    name: app
