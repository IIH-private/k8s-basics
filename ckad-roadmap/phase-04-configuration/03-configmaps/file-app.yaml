apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: file-app
  name: file-app
spec:
  volumes:
  - name: shared-config
    configMap:
     name: app-config-file
  containers:
  - command:
    - sh
    - -c
    - |
      ls -l /etc/app
      echo
      cat /etc/app/app.properties
      sleep 3600
    image: busybox:1.36
    name: file-app
    volumeMounts:
      - name: shared-config
        mountPath: /etc/app  
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
