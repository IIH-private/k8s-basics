apiVersion: v1
kind: Pod
metadata:
  name: keyref-demo
spec:
  containers:
  - command:
    - sh
    - -c
    - | 
      echo "APP_COLOR=$APP_COLOR"
      echo "APP_MODE=$APP_MODE"
      sleep 3600
    env:
    - name: APP_COLOR
      valueFrom:
        configMapKeyRef:
            name: app-config
            key: APP_COLOR  
    image: busybox:1.36
    name: demo
