apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: logger
  name: logger
spec:
  containers:
  - command:
    - sh
    - -c
    - | 
      echo LOG_LEVEL=$LOG_LEVEL
      sleep 3600

    env:
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-settings
          key: LOG_LEVEL
    image: busybox:1.36
    name: logger
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
