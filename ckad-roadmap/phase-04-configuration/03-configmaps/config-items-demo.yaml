apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: config-items-demo
  name: config-items-demo
spec:
  volumes:
    - name: config-volume
      configMap:
        name: app-config
        items:
        - key: LOG_LEVEL
          path: logging-level  
  containers:
  - command:
    - sh
    - -c
    - |
      ls -l /etc/app
      echo 
      cat /etc/app/logging-level
      echo
      sleep 3600
    image: alpine:3.20
    name: app
    volumeMounts:
    - name: config-volume
      mountPath: /etc/app  
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
