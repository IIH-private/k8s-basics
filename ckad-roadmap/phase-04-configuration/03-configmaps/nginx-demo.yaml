apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: nginx-demo
  name: nginx-demo
spec:
  volumes:
  - name: shared-conf
    configMap:
      name: web-config
  containers:
  - command:
    - sh
    - -c
    - |
      echo
      ls -l /etc/nginx/ 
      echo 
      cat /etc/nginx/nginx.conf
      echo
      sleep 3600
    image: busybox:1.36
    name: nginx-demo
    volumeMounts:
      - name: shared-conf
        mountPath: /etc/nginx
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
