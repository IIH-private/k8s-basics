apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: web
  name: web
spec:
  containers:
  - command:
    - sh
    - -c
    - |
       echo APP_COLOR=$APP_COLOR
       sleep 3600
    env:
    - name: APP_COLOR
      valueFrom:
        configMapKeyRef:
          name: app-settings
          key: APP_COLOR  
    image: busybox:1.36
    name: web
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
