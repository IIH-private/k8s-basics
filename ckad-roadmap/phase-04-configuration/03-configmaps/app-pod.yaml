apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: app
  name: app
spec:
  containers:
  - command:
    - sh
    - -c
    - |
      echo "APP_COLOR=$APP_COLOR"
      echo "APP_MODE=$APP_MODE"
      echo "LOG_LEVEL=$LOG_LEVEL"
      sleep 3600
    envFrom:
      - configMapRef:
          name: app-settings
    image: busybox:1.36
    name: app
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
